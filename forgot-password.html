<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Forgot Password - College of Innovation</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;

      background: linear-gradient(
        135deg,
        #f4f4f4,
        #e8e8e8
      );

      display: flex;
      flex-direction: column;
      align-items: center;
    }


    /* =========================
       LOGO
    ========================= */

    .logo-container {
      width: 100%;
      padding: 35px 60px;
    }

    .logo-container img {
      width: 240px;
      height: auto;
      display: block;
    }


    /* =========================
       AREA
    ========================= */

    .forgot-area {
      flex: 1;
      width: 100%;

      display: flex;
      justify-content: center;
      align-items: flex-start;

      padding: 20px;
    }


    /* =========================
       CARD
    ========================= */

    .card {
      width: 400px;
      max-width: 100%;

      background: white;

      border-radius: 20px;

      padding: 45px 40px;

      text-align: center;

      border-top: 6px solid #8b1a3d;

      box-shadow:
        0 15px 35px rgba(0,0,0,0.12);
    }


    /* =========================
       ICON
    ========================= */

    .icon {
      width: 70px;
      height: 70px;

      margin: 0 auto 20px;

      border-radius: 50%;

      background: #8b1a3d;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 30px;
    }


    /* =========================
       TITLE
    ========================= */

    .card h1 {
      font-size: 27px;

      letter-spacing: 2px;

      color: #222;

      margin-bottom: 12px;
    }


    .subtitle {
      font-size: 14px;

      line-height: 1.6;

      color: #888;

      margin-bottom: 28px;
    }


    /* =========================
       INPUT
    ========================= */

    .input-group {
      display: flex;

      align-items: center;

      background: #f7f7f7;

      border: 1px solid #eee;

      border-radius: 12px;

      padding: 15px 16px;

      margin-bottom: 18px;

      transition: 0.3s;
    }


    .input-group:focus-within {
      background: white;

      border-color: #8b1a3d;

      box-shadow:
        0 0 0 3px rgba(139,26,61,0.1);
    }


    .input-group span {
      font-size: 19px;

      margin-right: 12px;
    }


    .input-group input {
      width: 100%;

      border: none;

      outline: none;

      background: transparent;

      font-size: 15px;
    }


    .input-group input::placeholder {
      color: #999;
    }


    /* =========================
       BUTTON
    ========================= */

    .btn-reset {
      width: 100%;

      border: none;

      border-radius: 12px;

      padding: 15px;

      margin-top: 5px;

      background: #8b1a3d;

      color: white;

      font-size: 16px;

      font-weight: bold;

      letter-spacing: 1px;

      cursor: pointer;

      transition: 0.3s;
    }


    .btn-reset:hover {
      background: #6f1531;

      transform: translateY(-2px);

      box-shadow:
        0 8px 15px rgba(139,26,61,0.25);
    }


    /* =========================
       BACK LOGIN
    ========================= */

    .back-login {
      margin-top: 22px;

      font-size: 14px;

      color: #666;
    }


    .back-login a {
      color: #8b1a3d;

      font-weight: bold;

      text-decoration: none;
    }


    .back-login a:hover {
      text-decoration: underline;
    }


    /* =========================
       FOOTER
    ========================= */

    .footer {
      padding: 20px;

      font-size: 12px;

      color: #999;

      text-align: center;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .logo-container {
        padding: 25px 20px 10px;

        display: flex;

        justify-content: center;
      }


      .logo-container img {
        width: 190px;

        max-width: 75%;
      }


      .forgot-area {
        padding: 15px 12px 30px;
      }


      .card {
        width: 100%;

        max-width: 360px;

        padding: 32px 24px;

        border-radius: 18px;

        border-top-width: 5px;
      }


      .icon {
        width: 60px;
        height: 60px;

        font-size: 26px;

        margin-bottom: 18px;
      }


      .card h1 {
        font-size: 24px;

        letter-spacing: 2px;
      }


      .subtitle {
        font-size: 13px;

        margin-bottom: 24px;
      }


      .input-group {
        padding: 13px 14px;

        margin-bottom: 15px;
      }


      .input-group input {
        font-size: 15px;
      }


      .btn-reset {
        padding: 14px;

        font-size: 15px;
      }


      .footer {
        padding: 15px;

        font-size: 11px;
      }
    }

  </style>

</head>


<body>


  <!-- LOGO -->

  <div class="logo-container">

    <img
      src="images/logo-eng_new_logo-v3-min.png"
      alt="College of Innovation Logo"
    >

  </div>



  <!-- FORGOT PASSWORD -->

  <div class="forgot-area">

    <div class="card">


      <!-- ICON -->

      <div class="icon">
        🔑
      </div>


      <!-- TITLE -->

      <h1>
        FORGOT PASSWORD
      </h1>


      <p class="subtitle">
        Enter your email address and we will
        send you a link to reset your password.
      </p>


      <!-- FORM -->

      <form id="forgotPasswordForm">


        <div class="input-group">

          <span>✉️</span>

          <input
            type="email"
            id="resetEmail"
            placeholder="Email"
            required
          >

        </div>


        <button
          type="submit"
          class="btn-reset"
        >
          SEND RESET LINK
        </button>


      </form>


      <!-- BACK LOGIN -->

      <div class="back-login">

        Remember your password?

        <a href="index.html">
          Back to Login
        </a>

      </div>


    </div>

  </div>



  <!-- FOOTER -->

  <div class="footer">

    College of Innovation · Thammasat University

  </div>



  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <!-- AUTH -->

  <script src="auth.js"></script>


</body>

</html>
