<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - College of Innovation</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f1f1f1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-section {
            padding: 30px 20px 18px;
            text-align: center;
        }

        .logo-section img {
            width: 180px;
            max-width: 70%;
        }

        .card {
            width: 90%;
            max-width: 500px;
            background: white;
            border-top: 6px solid #981b45;
            border-radius: 0 0 22px 22px;
            padding: 35px;
            text-align: center;
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.09);
        }

        h1 {
            font-size: 28px;
            letter-spacing: 3px;
            margin-bottom: 10px;
            color: #222;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .input-box {
            width: 100%;
            height: 58px;
            background: #f8f8f8;
            border: 1px solid #e2e2e2;
            border-radius: 13px;
            margin-bottom: 15px;
        }

        .input-box input {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            background: transparent;
            padding: 0 16px;
            font-size: 15px;
        }

        .btn {
            width: 100%;
            height: 58px;
            border: none;
            border-radius: 13px;
            background: #981b45;
            color: white;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn:hover {
            background: #7f163a;
        }

        .back {
            display: block;
            margin-top: 20px;
            color: #981b45;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }

        footer {
            margin-top: auto;
            padding: 25px;
            color: #999;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            .logo-section {
                padding-top: 25px;
            }

            .logo-section img {
                width: 155px;
            }

            .card {
                width: 88%;
                padding: 28px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .input-box,
            .btn {
                height: 54px;
            }
        }
    </style>
</head>

<body>

    <div class="logo-section">
        <img
            src="images/logo-eng_new_logo-v3-min.png"
            alt="College of Innovation"
        >
    </div>

    <div class="card">

        <h1>RESET PASSWORD</h1>

        <p class="subtitle">
            Enter your new password
        </p>

        <form id="resetPasswordForm">

            <div class="input-box">
                <input
                    type="password"
                    id="newPassword"
                    placeholder="New Password"
                    required
                >
            </div>

            <div class="input-box">
                <input
                    type="password"
                    id="confirmNewPassword"
                    placeholder="Confirm New Password"
                    required
                >
            </div>

            <button type="submit" class="btn">
                UPDATE PASSWORD
            </button>

        </form>

        <a href="index.html" class="back">
            Back to Login
        </a>

    </div>

    <footer>
        College of Innovation · Thammasat University
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>

</body>
</html>
