<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - College of Innovation</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #f4f4f4, #e8e8e8);

      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* LOGO */

    .logo-container {
      width: 100%;
      padding: 35px 60px;
    }

    .logo-container img {
      width: 240px;
      height: auto;
      display: block;
    }

    /* LOGIN AREA */

    .login-area {
      flex: 1;
      width: 100%;

      display: flex;
      justify-content: center;
      align-items: flex-start;

      padding: 20px;
    }

    /* CARD */

    .card {
      width: 400px;
      max-width: 100%;

      background: white;

      border-radius: 20px;

      padding: 45px 40px;

      text-align: center;

      border-top: 6px solid #8b1a3d;

      box-shadow:
        0 15px 35px rgba(0,0,0,0.12);
    }

    /* TITLE */

    .card h1 {
      font-size: 30px;
      letter-spacing: 2px;
      color: #222;

      margin-bottom: 30px;
    }

    /* INPUT */

    .input-group {
      display: flex;
      align-items: center;

      background: #f7f7f7;

      border: 1px solid #eee;

      border-radius: 12px;

      padding: 15px 16px;

      margin-bottom: 18px;

      transition: 0.3s;
    }

    .input-group:focus-within {
      background: white;

      border-color: #8b1a3d;

      box-shadow:
        0 0 0 3px rgba(139,26,61,0.1);
    }

    .input-group span {
      font-size: 20px;
      margin-right: 12px;
    }

    .input-group input {
      width: 100%;

      border: none;
      outline: none;

      background: transparent;

      font-size: 16px;
    }

    .input-group input::placeholder {
      color: #999;
    }

    /* LOGIN BUTTON */

    .btn-login {
      width: 100%;

      border: none;

      border-radius: 12px;

      padding: 15px;

      margin-top: 8px;

      background: #8b1a3d;

      color: white;

      font-size: 17px;

      font-weight: bold;

      letter-spacing: 1px;

      cursor: pointer;

      transition: 0.3s;
    }

    .btn-login:hover {
      background: #6f1531;

      transform: translateY(-2px);

      box-shadow:
        0 8px 15px rgba(139,26,61,0.25);
    }

    /* FORGOT PASSWORD */

    .forgot-password {
      margin-top: 16px;

      font-size: 14px;
    }

    .forgot-password a {
      color: #8b1a3d;

      text-decoration: none;

      font-weight: bold;

      cursor: pointer;
    }

    .forgot-password a:hover {
      text-decoration: underline;
    }

    /* SIGN UP */

    .signup-text {
      margin-top: 22px;

      font-size: 14px;

      color: #666;
    }

    .signup-text a {
      color: #8b1a3d;

      font-weight: bold;

      text-decoration: none;
    }

    .signup-text a:hover {
      text-decoration: underline;
    }

    /* FOOTER */

    .footer {
      padding: 20px;

      font-size: 12px;

      color: #999;

      text-align: center;
    }

    /* MOBILE */

    @media (max-width: 600px) {

      .logo-container {
        padding: 25px 20px 10px;

        display: flex;

        justify-content: center;
      }

      .logo-container img {
        width: 190px;

        max-width: 75%;
      }

      .login-area {
        padding: 15px 12px 30px;
      }

      .card {
        width: 100%;

        max-width: 360px;

        padding: 32px 24px;

        border-radius: 18px;

        border-top-width: 5px;
      }

      .card h1 {
        font-size: 25px;

        letter-spacing: 2px;

        margin-bottom: 28px;
      }

      .input-group {
        padding: 13px 14px;

        margin-bottom: 15px;

        border-radius: 10px;
      }

      .input-group span {
        font-size: 18px;

        margin-right: 10px;
      }

      .input-group input {
        font-size: 15px;
      }

      .btn-login {
        padding: 14px;

        font-size: 15px;

        border-radius: 10px;
      }

      .signup-text {
        margin-top: 20px;

        font-size: 14px;
      }

      .forgot-password {
        margin-top: 14px;
      }

      .footer {
        padding: 15px;

        font-size: 11px;
      }
    }

    /* SMALL PHONE */

    @media (max-width: 380px) {

      .logo-container {
        padding-top: 20px;
      }

      .logo-container img {
        width: 170px;
      }

      .card {
        max-width: 340px;

        padding: 28px 20px;
      }

      .card h1 {
        font-size: 23px;

        margin-bottom: 25px;
      }

      .input-group {
        padding: 12px;
      }

      .btn-login {
        padding: 13px;
      }
    }

  </style>
</head>


<body>


  <!-- LOGO -->

  <div class="logo-container">

    <img
      src="images/logo-eng_new_logo-v3-min.png"
      alt="College of Innovation Logo"
    >

  </div>


  <!-- LOGIN -->

  <div class="login-area">

    <div class="card">

      <h1>LOGIN</h1>


      <form id="loginForm">


        <!-- EMAIL OR USERNAME -->

        <div class="input-group">

          <span>👤</span>

          <input
            type="text"
            id="loginIdentifier"
            placeholder="Email or Username"
            required
          >

        </div>


        <!-- PASSWORD -->

        <div class="input-group">

          <span>🔒</span>

          <input
            type="password"
            id="loginPassword"
            placeholder="Password"
            required
          >

        </div>


        <!-- LOGIN -->

        <button
          type="submit"
          class="btn-login"
        >
          LOGIN
        </button>


      </form>


      <!-- FORGOT PASSWORD -->

      <div class="forgot-password">

        <a href="forgot-password.html">
          Forgot Password?
        </a>

      </div>


      <!-- SIGN UP -->

      <div class="signup-text">

        Don't have an account?

        <a href="signup.html">
          Sign up here
        </a>

      </div>


    </div>

  </div>


  <!-- FOOTER -->

  <div class="footer">

    College of Innovation · Thammasat University

  </div>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- AUTH -->

  <script src="auth.js"></script>


</body>

</html>
