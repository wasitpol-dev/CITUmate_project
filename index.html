<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - College of Innovation</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
  background: linear-gradient(135deg, #f4f4f4, #e8e8e8);

  display: flex;
  flex-direction: column;
  align-items: center;
}

/* LOGO */
.logo-container {
  width: 100%;
  padding: 35px 60px;
}

.logo-container img {
  width: 280px;
  height: auto;
  display: block;
}

/* LOGIN AREA */
.login-area {
  flex: 1;
  width: 100%;

  display: flex;
  justify-content: center;
  align-items: flex-start;

  padding-top: 30px;
}

/* CARD */
.card {
  width: 400px;
  background: white;

  border-radius: 18px;

  padding: 42px 40px 35px;

  text-align: center;

  border-top: 6px solid #8b1a3d;

  box-shadow: 0 15px 35px rgba(0,0,0,0.12);
}

.card h1 {
  font-size: 28px;
  letter-spacing: 4px;
  color: #222;

  margin-bottom: 35px;
}

/* INPUT */
.input-group {
  display: flex;
  align-items: center;

  background: #f7f7f7;

  border: 1px solid #eee;

  border-radius: 10px;

  padding: 14px 16px;

  margin-bottom: 18px;

  transition: 0.3s;
}

.input-group:focus-within {
  background: white;

  border-color: #8b1a3d;

  box-shadow: 0 0 0 3px rgba(139,26,61,0.1);
}

.input-group span {
  font-size: 19px;
  margin-right: 12px;
}

.input-group input {
  width: 100%;

  border: none;
  outline: none;

  background: transparent;

  font-size: 15px;
}

.input-group input::placeholder {
  color: #999;
}

/* BUTTON */
.btn-login {
  width: 100%;

  border: none;
  border-radius: 10px;

  padding: 15px;

  margin-top: 8px;

  background: #8b1a3d;
  color: white;

  font-size: 16px;
  font-weight: bold;

  letter-spacing: 1px;

  cursor: pointer;

  transition: 0.3s;
}

.btn-login:hover {
  background: #6f1531;
  transform: translateY(-2px);
}

/* SIGN UP */
.signup-text {
  margin-top: 22px;

  font-size: 14px;

  color: #666;
}

.signup-text a {
  color: #8b1a3d;

  font-weight: bold;

  text-decoration: none;
}

.signup-text a:hover {
  text-decoration: underline;
}
</style>
</head>

<body>

<!-- LOGO -->
<div class="logo-container">

  <img
    src="images/logo-eng_new_logo-v3-min.png"
    alt="College of Innovation Logo"
  >

</div>


<!-- LOGIN -->
<div class="login-area">

  <div class="card">

    <h1>LOGIN</h1>

    <form id="loginForm">

      <!-- EMAIL -->
      <div class="input-group">

        <span>👤</span>

        <input
          type="email"
          id="loginEmail"
          placeholder="Email"
          required
        >

      </div>


      <!-- PASSWORD -->
      <div class="input-group">

        <span>🔒</span>

        <input
          type="password"
          id="loginPassword"
          placeholder="Password"
          required
        >

      </div>


      <!-- LOGIN BUTTON -->
      <button
        type="submit"
        class="btn-login"
      >
        LOGIN
      </button>

    </form>


    <!-- SIGN UP LINK -->
    <div class="signup-text">

      Don't have an account?

      <a href="signup.html">
        Sign up here
      </a>

    </div>

  </div>

</div>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- AUTH -->
<script src="auth.js"></script>

</body>
</html>
