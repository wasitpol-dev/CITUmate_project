<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Sign Up - College of Innovation</title>
<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #f5f5f5, #e6e6e6);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 20px;
  }

  .logo-bar {
    width: 100%;
    max-width: 1000px;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 40px;
  }
  .logo-icon { display: flex; }
  .logo-icon .sq1 { width: 22px; height: 22px; background:#8a1c2b; }
  .logo-icon .sq2 { width: 22px; height: 22px; background:#8c8c8c; margin-left:-4px; }
  .logo-text { font-size: 20px; }
  .logo-text .sub { color:#555; font-weight: 400; letter-spacing:1px; }
  .logo-text .main { color:#8a1c2b; font-weight: 800; letter-spacing:1px; }
  .logo-text small { display:block; color:#555; font-size:12px; letter-spacing:2px; }

  .card {
    background: #ffffff;
    border-radius: 16px;
    padding: 40px 35px;
    width: 340px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    text-align: center;
    border-top: 6px solid #8a1c2b;
  }

  h2 {
    color: #333;
    margin-bottom: 25px;
    letter-spacing: 2px;
    font-size: 22px;
  }

  .input-group {
    display: flex;
    align-items: center;
    background: #f4f4f4;
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 16px;
    text-align: left;
  }
  .input-group span.icon { color: #8a1c2b; margin-right: 8px; }
  .input-group input {
    border: none; background: transparent; outline: none;
    width: 100%; font-size: 14px; color: #333;
  }

  button.btn {
    width: 100%; padding: 13px;
    background: #8a1c2b; color: #fff; border: none;
    border-radius: 25px; font-size: 14px; letter-spacing: 2px;
    cursor: pointer; transition: 0.3s; margin-top: 5px;
  }
  button.btn:hover { background: #6f1622; }

  .link-text { margin-top: 16px; font-size: 12px; color: #777; }
  .link-text a { color: #8a1c2b; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>

  <div class="logo-bar">
    <div class="logo-icon">
      <div class="sq1"></div>
      <div class="sq2"></div>
    </div>
    <div class="logo-text">
      <span class="sub">COLLEGE OF</span><br>
      <span class="main">INNOVATION</span>
      <small>THAMMASAT UNIVERSITY</small>
    </div>
  </div>

  <div class="card">
    <h2>SIGN UP</h2>
    <div class="input-group">
      <span class="icon">&#128100;</span>
      <input type="text" placeholder="Username">
    </div>
    <div class="input-group">
      <span class="icon">&#9993;</span>
      <input type="email" placeholder="E-mail">
    </div>
    <div class="input-group">
      <span class="icon">&#128274;</span>
      <input type="password" placeholder="Password">
    </div>
    <div class="input-group">
      <span class="icon">&#128274;</span>
      <input type="password" placeholder="Confirm Password">
    </div>
    <button class="btn">CREATE ACCOUNT</button>
    <div class="link-text">Already have an account? <a href="login.html">Login here</a></div>
  </div>

</body>
</html>
